
name: "Build & Deploy Open SDG + Static RAG (GPT)"

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write   # erforderlich, damit der Workflow in das Repo pushen darf

concurrency:
  group: build-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true  # nutzt GITHUB_TOKEN für Push

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          # aktuell nur Standardlib nötig; pyyaml bleibt optional, falls weitere Steps sie brauchen
          pip install pyyaml

      - name: Show workspace structure (before)
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          ls -la
          echo "------"
          ls -la assets || true
          echo "------"
          ls -la assets/data || true

      # Erzeugt assets/data/indicators.json (enriched)
      - name: Build enriched indicators JSON
        run: |
          set -euo pipefail
          mkdir -p assets/data
          python tools/enrich_training_data.py \
            --input training_data.json \
            --output assets/data/indicators.json \
            --keywords 12 \
            --short-len 280

      - name: Show outputs (after)
        run: |
          ls -la assets/data || true
          echo "File size:"
          du -h assets/data/indicators.json || true
          echo "Head:"
          head -n 30 assets/data/indicators.json || true

      # Falls du zusätzlich facts/docs generierst, hier einkommentieren:
      # - name: Build static RAG JSONs (facts/docs)
      #   run: python tools/build_static_rag.py

      - name: Commit generated JSONs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # WICHTIG: indicators.json hinzufügen (ggf. weitere Dateien ergänzen)
          git add assets/data/indicators.json
          # Wenn du facts/docs zusätzlich baust, füge sie hier hinzu:
          # git add assets/data/facts.json assets/data/docs.json

          if ! git diff --cached --quiet; then
            git commit -m "Auto-update indicators.json (enriched) [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
``
