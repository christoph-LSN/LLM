name: Build & Deploy Open SDG + Static RAG

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      # Erzeugt assets/data/facts.json und assets/data/docs.json
      - name: Build static RAG JSONs
        run: python tools/build_static_rag.py

      # >>> HIER kommt dein bisheriger Open‑SDG/Jekyll/Pages‑Schritt <<<
      # Falls GitHub Pages die Site automatisch baut, brauchst du evtl. nur
      # den Upload der generierten Dateien committen – ansonsten Jekyll-Build
      # + Deploy auf gh-pages ergänzen.

