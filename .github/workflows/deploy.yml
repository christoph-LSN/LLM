name: Build & Deploy Open SDG + Static RAG (GPT)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true  # wichtig für push

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      # Erzeugt assets/data/facts.json und assets/data/docs.json
      - name: Build static RAG JSONs enriched
        run: python tools/enrich_traning_data.py

      #  run: python tools/build_static_rag.py

      # Commit & push nur, wenn sich die Dateien geändert haben
      - name: Commit generated JSONs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/facts.json assets/data/docs.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update generated JSON files"
            git push
          else
            echo "No changes to commit"
          fi
