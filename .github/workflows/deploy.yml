
name: Build & Deploy Open SDG + Static RAG (GPT)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true  # nutzt das GITHUB_TOKEN für push

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Show workspace structure (before)
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          ls -la || true
          echo "------ assets ------"
          ls -la assets || true
          echo "------ assets/data ------"
          ls -la assets/data || true

      - name: Ensure training_data.json exists
        run: |
          if [[ ! -f "training_data.json" ]]; then
            echo "::error file=training_data.json::training_data.json nicht im Repo-Root gefunden."
            echo "Passe ggf. --input an (z. B. data/training_data.json)."
            exit 1
          fi

      - name: Build enriched indicators JSON
        run: |
          set -euo pipefail
          mkdir -p assets/data
          echo "[INFO] Running enrich script..."
          python tools/enrich_training_data.py \
            --input training_data.json \
            --output assets/data/indicators.json \
            --keywords 12 \
            --short-len 280

      - name: Show outputs (after)
        run: |
          echo "[INFO] assets/data listing:"
          ls -la assets/data || true
          echo "[INFO] Size:"
          du -h assets/data/indicators.json || true
          echo "[INFO] Preview:"
          head -n 30 assets/data/indicators.json || true

      - name: Commit generated JSONs
        run: |
          set -e
          if [[ ! -f "assets/data/indicators.json" ]]; then
            echo "indicators.json wurde nicht erzeugt – Commit wird übersprungen."
            exit 0
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add assets/data/indicators.json || true

          if ! git diff --cached --quiet; then
            git commit -m "Auto-update indicators.json (enriched) [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
